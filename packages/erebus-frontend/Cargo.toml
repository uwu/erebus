[package]
name = "erebus-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
erebus-backend = { workspace = true }
erebus-ipc = { workspace = true }
erebus-theme = { workspace = true }
notify-debouncer-mini = "0.7"
interprocess = "2.4"
dirs = "6"

[target.'cfg(windows)'.dependencies]
lnk = "0.6"
pelite = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
