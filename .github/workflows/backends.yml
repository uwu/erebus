name: Backends

on:
  push:
    branches: [main]
    paths: &paths
      - "packages/erebus-backend/**"
      - "packages/erebus-backend-vulkan/**"
      - "packages/erebus-backend-d3d11/**"
      - "packages/erebus-ipc/**"
      - "packages/erebus-theme/**"
      - "packages/test-theme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "erebus_vk.json"
      - ".github/workflows/backends.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulkan:
    name: erebus-backend-vulkan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install && rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p erebus-theme -p erebus-ipc -p erebus-backend -p erebus-backend-vulkan --all-targets

      - name: Test
        run: cargo test --locked -p erebus-theme -p erebus-ipc -p erebus-backend -p erebus-backend-vulkan

      - name: Build release
        run: cargo build --locked --release -p erebus-backend-vulkan

      - uses: actions/upload-artifact@v7
        with:
          name: liberebus_vulkan.so
          path: |
            target/release/liberebus_vulkan.so
            erebus_vk.json
          retention-days: 14

  d3d11:
    name: erebus-backend-d3d11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/erebus-backend-d3d11 -> ../../target/d3d11

      - name: Clippy
        working-directory: packages/erebus-backend-d3d11
        run: cargo clippy --locked --all-targets

      - name: Test
        working-directory: packages/erebus-backend-d3d11
        run: cargo test --locked

      - name: Build release
        working-directory: packages/erebus-backend-d3d11
        run: cargo build --locked --release

      - uses: actions/upload-artifact@v7
        with:
          name: d3d11.dll
          path: target/d3d11/x86_64-pc-windows-msvc/release/d3d11.dll
          retention-days: 14
