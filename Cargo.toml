[workspace]
members = ["packages/*"]
exclude = ["packages/erebus-backend-d3d11"]
resolver = "2"

[workspace.dependencies]
serde = "1"
log = "0.4"
postcard = { version = "1.1.3", features = ["alloc"] }
erebus-frontend = { path = "./packages/erebus-frontend", version = "0.1.0" }
erebus-backend = { path = "./packages/erebus-backend", version = "0.1.0" }
erebus-theme = { path = "./packages/erebus-theme", version = "0.1.0" }
erebus-ipc = { path = "./packages/erebus-ipc", version = "0.1.0" }
